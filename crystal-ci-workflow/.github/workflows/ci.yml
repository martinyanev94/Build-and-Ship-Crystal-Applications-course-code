name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - run: shards install
      - run: crystal tool format --check
      - run: bin/ameba
      - run: crystal spec
      - run: crystal build --release --no-debug src/main.cr -o bin/reading-report
      - run: ./bin/reading-report
      - uses: actions/upload-artifact@v4
        with:
          name: reading-report-linux
          path: bin/reading-report
